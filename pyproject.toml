[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wallclock"
version = "0.2.0"
description = "Temporal-contract verification for scheduled jobs: exact wall-clock simulation, proofs, counterexample witnesses, semantic diff and repair synthesis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "n44897162-eng" }]
keywords = ["cron", "rrule", "timezone", "dst", "scheduling", "verification", "calendar", "ics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  # Windows has no system zoneinfo database; without this every zone lookup fails.
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Pyramid of extras:
#   .[windows]  - required on Windows, which has no system tz database
#   .[yaml]     - YAML config files (JSON configs need nothing)
#   .[test]     - the full differential test suite (includes the YAML tests)
windows = ["tzdata>=2024.1"]
yaml = ["pyyaml>=6"]
test = [
  "pytest>=8",
  "python-dateutil>=2.8",
  "croniter>=2",
  "pyyaml>=6",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.scripts]
wallclock = "wallclock.cli:main"

[tool.setuptools]
packages = ["wallclock"]

[tool.setuptools.package-data]
wallclock = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
